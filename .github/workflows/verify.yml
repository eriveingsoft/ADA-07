name: Verify Agent-Ready Contract

on:
  push:
    branches: [ "main", "after-improvements" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        
    - name: Run Repository Verification Script
      shell: pwsh
      run: ./scripts/verify_repo.ps1